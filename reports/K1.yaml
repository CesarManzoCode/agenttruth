  negative_controls: {total: 8, behaved_as_expected: 8}
  negative_control_outcomes:
    - {criterion: K1-C1, sabotage: "append a byte to ds1 build B events.jsonl", failing: [K1-C1], result: pass}
    - {criterion: K1-C2, sabotage: "ea-uploads-july-filtered + 1 in a ledger copy", failing: [K1-C2], result: pass}
    - {criterion: K1-C3, sabotage: "SIG_TEST_ACCOUNTS added to ea-signups-day-0714 in a catalog copy", failing: [K1-C3], result: pass}
    - {criterion: K1-C4, sabotage: "F1 date_to 2026-07-17 -> 2026-07-18 in a spec copy", failing: [K1-C4], result: pass}
    - {criterion: K1-C5, sabotage: "oracle output for mutation M1 patched back to the base truths", failing: [K1-C5], result: pass}
    - {criterion: K1-C6, sabotage: "ea-signups-day-0714 renamed to the duplicate id ea-uploads-july-filtered in a catalog copy", failing: [K1-C6], result: pass}
    - {criterion: K1-C7, sabotage: "type error appended to a copy of evidence/canonical.py; ruff, mypy, pytest run on the copy", failing: [K1-C7], result: pass}
    - {criterion: K1-C8, sabotage: "temporary module oracle/_negative_control.py importing dataset.generate in a source copy", failing: [K1-C8], result: pass}
  how_controls_are_run: >-
    Each sabotage is applied to a copy of an input its target criterion reads (built file, ledger, catalog, spec,
    oracle output, source tree). Every criterion is then evaluated again. Non-target criteria read their unchanged
    inputs; their dataset builds, oracle runs and toolchain runs are memoized by input digest within the gate run,
    so they are re-judged on the same observations.
  runtime: "4 min 39 s locally (Python 3.14.6, uv 0.12.24, Node 24.21.0); about 4.5 min on GitHub's ubuntu-24.04"
  repeatability: >-
    Two evidence runs (on 1f745ae and c40702b) produced byte-identical artifacts except the C7 toolchain log,
    which contains timings. GitHub Actions run 37975945133 on 1f745ae also gave verdict pass, with every
    control failing exactly its target. GitHub Actions run 37976783046 on c40702b (the judged commit) is green:
    uv sync --frozen, make check, make gate-K1 and make verify-evidence. Locally, `make gates` on c40702b with
    this evidence in the tree gave verdict pass and `evidence verify` ok (14 artifacts, 1 manifest).
