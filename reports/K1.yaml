design_said_vs_system_did:
  - design: >-
      F-23 (FACT, sources S13, S01q, S01r): retention defaults are period Day and 7 total intervals.
    system: >-
      At PostHog e606d69, posthog/schema.py declares RetentionFilter.totalIntervals default 8
      (line 29705) and AssistantRetentionFilter.totalIntervals default 8, described as "8 (meaning
      7 periods after initial cohort)" (lines 10651-10656). The runner's DEFAULT_TOTAL_INTERVALS = 7
      (retention_query_runner.py line 71) is only a fallback for a null or 0 value (lines 385, 387).
      "7" is the number of periods after period 0; the setting's default value is 8.
  - design: >-
      §7.4 lists retentionFilter.totalIntervals=8 as an RS value, and requires every RS value to
      differ from its default in the vendored posthog/schema.py snapshot.
    system: >-
      8 equals the schema default, so the RS lint of K1-C6 must reject the catalog. The other 25 RS
      values differ from their defaults (evidence/K1/rs-defaults-check.json).
