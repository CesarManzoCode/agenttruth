blocked:
  condition: 2
  related_conditions: [4]
  summary: >-
    K1-C6 cannot pass without changing the contract. §7.4 fixes the RS value
    retentionFilter.totalIntervals=8 and also requires every RS value to differ from its default
    in the vendored posthog/schema.py, which K1-C6 checks with `scenarios lint`. At the pinned
    commit that default is 8. Making the lint pass would mean changing a normative catalog value
    or relaxing a lint rule, and AGENTS.md forbids both. The value 8 was probably chosen because
    F-23 says the default is 7 total intervals. At the pin, 7 is only the runner's fallback for a
    null value; the schema default is 8.
  attempted:
    - "Read AGENTS.md, CONTRACT.md §1-§9, §13, §14 (common, K1), §16-§18, and ADR-0001, 0006, 0007, 0008, 0012, 0013, 0017, 0019."
    - "Sparse-cloned PostHog at e606d69 (git clone --filter=blob:none --sparse) and vendored schema.ts, schema.py, schema_enums.py and LICENSE."
    - "Extracted the default of every §7.4 RS key from the vendored snapshot by AST parsing, with a stdlib-only script kept as evidence."
    - "Checked that the §16 Python toolchain resolves (it does) before stopping, so the owner sees every open item at once."
  command: "python3 -I evidence/K1/rs_defaults_check.py third_party/posthog/posthog"
  output: >-
    exit 1; violations: ["retention.retentionFilter.totalIntervals"]; record
    {"field":"totalIntervals","rs_key":"retention.retentionFilter.totalIntervals","rs_value":8,
    "schema_class":"RetentionFilter","schema_default":8,"schema_line":29705,"differs_from_default":false}
  evidence:
    - "evidence/K1/manifest.json sha256 8e11963c7415e8f68158ccbeb9dcaaadd231c5b5f7a53d07daed0998f991b63a"
    - "evidence/K1/rs-defaults-check.json sha256 8502959abaa4dd68790ee5638fb346b3f8995e39f0a35437c73199ed65b03075"
    - "evidence/K1/rs_defaults_check.py sha256 9763f413e86d48fc7bcd6c9871aa0805db77681eb66bc341fb187f84c68512e6"
    - "evidence/K1/posthog-schema-retention-excerpt.txt sha256 a14c50143f2dec547b387308226f2de615d6c6e0373853cb23458576e5606b84"
    - "evidence/K1/posthog-retention-runner-excerpt.txt sha256 e81d515a6df06c3a0d99c2e04737e2a764aff7051b8603ee0e9b93ac8a0490bb (PostHog blob ebebbca1292053aaf774e0973c867d60a095e7d8)"
    - "evidence/K1/toolchain-resolution.txt sha256 bc988bb9bae9dc3f4cc7be361e4944bd6c4dd5e9a4565bbff6c9e1b433695115"
    - "third_party/posthog/posthog/schema.py git blob 6dd039d82772f0f47c09d92be565a669d18ac5f2 (line 29705)"
  options:
    - option: A
      change: >-
        ADR amending §7.4 to retentionFilter.totalIntervals=10, and F-23 to read "totalIntervals
        defaults to 8 in posthog/schema.py (period 0 plus 7 periods); the runner falls back to 7 only
        for a null or 0 value". 10 is just one choice; any integer other than 8 that PostHog accepts
        works, and 10 also differs from the fallback 7.
      consequence: >-
        No evidence is invalidated (catalog v1 is not written yet). K4 then tests a non-default
        value, which is what §7.4 intends. The lint rule stays as written.
    - option: B
      change: "ADR removing retentionFilter.totalIntervals from the RS list."
      consequence: "One fewer round-trip field. Retention still covers period, retentionType and cumulative."
    - option: C
      change: "ADR making the lint compare totalIntervals against the runner fallback (7) instead of schema.py."
      consequence: >-
        Not recommended. It contradicts §7.4's stated default source, and it keeps a value that
        schema-based paths fill in when the key is missing. Wherever a query is re-validated through
        PostHog's schema, a stored 8 could not show whether the setting survived.
  recommendation: >-
    Option A. Before re-running prompts/K1.md, please also decide the three items under
    other_open_decisions, so that K1 does not stop again on them.
  other_open_decisions:
    - id: K1-C4-literal-reading
      kind: "condition 2 (would surface at K1-C4); found at design time, not run"
      summary: >-
        Read literally, "changes no other EA truth" cannot hold for F1 and F3 with the §7.4 catalog.
        F1 (uploaded_file from Android not emitted 2026-07-15..17) lies inside ea-uploads-july-filtered
        (uploaded_file total 2026-07-01..07-31, §7.2) and ea-uploads-by-os-july. Disabling F1 emits
        those uploads, so both truths must change. F3 (no $identify for /signup/mobile sign-ups
        2026-06-22..28) splits those users from their later activity. That changes June sign-up
        metrics (ea-funnel-signup-upload-june, ea-funnel-signup-upload-1d,
        ea-sql-power-uploaders), and the "conversion drop" it causes is the symptom §5.2 plants.
      options:
        - option: A
          change: >-
            Let the fault's probe metrics include the EA scenarios that observe it, declared per
            scenario in the catalog (e.g. agenttruth.observes_faults: [F1]). K1-C4 then checks four
            things. (i) Every event that differs between the faulted build and the fault-disabled
            build lies inside the fault's window and segment as declared in §5.2. (ii) Those
            differing events fall on both the first and last day of the window. (iii) Every PC probe
            metric and every declared observing EA truth changes. (iv) No undeclared EA truth
            changes.
          consequence: >-
            The criterion stays exact and falsifiable in both directions. The negative control
            (enlarge a fault window by a day) fails it through (i) and (ii).
        - option: B
          change: "Move fault windows or EA ranges so that no EA metric covers any fault."
          consequence: "Changes contract-fixed scenario ids and meanings (e.g. 'july'), or the faults in §5.2."
      recommendation: "Option A."
    - id: K1-C3-every-scenario
      kind: "clarification"
      summary: >-
        K1-C3 says "every scenario declares at least 3 signatures", but §6.3 defines signature
        transforms only for exact-answer scenarios, and a planted-cause answer is a cause, not a number.
      recommendation: "Confirm that the minimum of 3 signatures applies to EA scenarios only and that PC scenarios declare none."
    - id: node-validator-pins
      kind: "clarification (§16 does not list these)"
      summary: >-
        The vendored schema.ts imports both `zod` and `yaml` when the module loads, and the validator
        runs through tsx. PostHog's pnpm-lock.yaml at e606d69 resolves zod 4.3.6, yaml 2.9.0 and
        tsx 4.20.5 for services/mcp.
      recommendation: "Pin exactly zod 4.3.6, yaml 2.9.0 and tsx 4.20.5 in third_party/posthog/ (or add them to §16)."
