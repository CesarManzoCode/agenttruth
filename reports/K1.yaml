demonstrated:
  - >-
    ds0 and ds1 build byte-for-byte: two fresh processes with different PYTHONHASHSEED produce identical
    events.jsonl, ledger.json and manifest.json, equal to the committed locks. This holds locally and on
    GitHub's ubuntu-24.04 (K1-C1).
  - >-
    For all 21 EA/PC scenarios, the ledger derived from journeys equals the oracle derived from events
    (K1-C2). Beyond the gate, all 60 metric variants of tests/test_ledger_vs_oracle.py agree on ds0 and on a
    reduced ds1.
  - "The 73 declared signatures of the 16 EA scenarios are pairwise distinguishable from each other and from the truth (K1-C3)."
  - >-
    Each planted fault F1–F5 is switchable in isolation. Its diff stays inside the §5.2 window and segment, its
    PC probes change, and exactly the declared EA truths change (K1-C4).
  - "Five event-file mutations change exactly the scenario truths the construction ledger predicts, by the predicted amount (K1-C5)."
  - >-
    The catalog passes lint, including the RS default check against the vendored schema.py. Its export
    validates against PostHog's vendored schema.ts with zod 4.3.6 (K1-C6).
  - "ruff, ruff format, mypy --strict and 57 offline tests pass with the socket guard active (K1-C7)."
  - "The §4.1 import rules hold, by the gate's own AST check and by an independent pytest AST test (K1-C8)."
  - "Every gate criterion detects its sabotage: 8 of 8 negative controls fail exactly their target criterion."
not_demonstrated:
  - >-
    Anything about PostHog. K1 never contacts it. Whether PostHog's REST API or MCP computes these truths (L1/L2),
    and whether the semantic readings above match PostHog, is K2's work.
  - "That the reviewed HogQL strings of the four SQL scenarios run in PostHog or return the oracle's values."
  - "That the RS/RA settings round-trip through the MCP (K4), or anything about agents (K3+)."
  - "Redaction against real credentials or transcripts. Only the mechanism and its unit tests exist; `audit secrets` is a later sprint."
  - "That the planted-cause detectors generalise beyond ds1 (L-20)."
