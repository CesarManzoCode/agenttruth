design_said_vs_system_did:
  - design: "SEM-03: math=dau counts distinct persons."
    system: >-
      A range-level 'unique users' value counts each person once over the whole range, not as a sum of daily
      uniques. ea-active-week-0706 = 351 persons, against 546 logged_in events (its SIG_AGG_TOTAL).
  - design: "SEM-04: an anonymous id merged by $identify belongs to the identified person; merging two already-identified persons is refused (F-24)."
    system: >-
      Identity is resolved statically over the whole file, so a merge covers past and future events. An
      $identify is ignored when its $anon_distinct_id has already been the identified id of an $identify, or is
      already merged elsewhere; tests/test_oracle_rules.py covers both cases.
  - design: "SEM-05: exclude events whose person email at event time contains @hedgebox-internal.example."
    system: >-
      The email at event time is the latest $set.email on the person's earlier or same events (case-insensitive
      match). Events with no known email pass the not_icontains filter. Internal users carry their email from
      their first event, so the person-properties mode does not change the result.
  - design: "SEM-06: strict order means no other event of the person between consecutive steps."
    system: >-
      'Other event' means any event of the person inside the date range, after the test-account filter,
      including $identify and server-side paid_bill. Because $identify follows signed_up, the strict
      sign-up funnels convert 0, which is their SIG_FUNNEL_ORDER value. K2 should check this reading first.
  - design: "SEM-07: a step at exactly step1 + window counts as converted."
    system: >-
      Windows are fixed durations in milliseconds (1 day = 86,400,000 ms; the timezone has no DST). Planted users
      at the window and window ± 1 s convert, convert and do not convert for the 1-hour, 1-day, 14-day and
      30-day funnels (ds1 spec labels pw1h-*, fw1d-*, fw14d-*, aw30-*).
  - design: "SEM-09: a person enters once, on the step-1 event that reaches the furthest step."
    system: "The furthest step over every step-1 candidate in range is counted. Counts do not depend on tie-breaking."
  - design: "SEM-10/11: retention first-time cohort is the first start event in range; return in period k; Period 0 = cohort."
    system: >-
      Return events are not limited to the cohort date range, only by bucket. 'cumulative' counts a return in
      any bucket from period_index to total_intervals − 1. Weeks start Monday 00:00 local.
  - design: "§6.3 SIG_PERIOD_PREV / SIG_PERIOD_NEXT: shift the range by its own length."
    system: >-
      Implemented literally: July 2026 shifts to 2026-05-31..06-30, not to calendar June. For June scenarios the
      previous range reaches the warm-up, so warm-up data counts in those signature values.
  - design: "§9.2 planted-cause value equal / contains the planted substring."
    system: >-
      PC truths record the value observed in events. F3's is the sign-up path '/signup/mobile/' (with trailing
      slash) and F4's is the domain 'hedgebox-internal.example'. The catalog's value_match records the contract
      substrings (/signup/mobile, hedgebox-internal.example), and lint checks that each truth contains its
      substring.
  - design: "K1-C4 (1.0.1): declared fault overlaps, window and segment confinement."
    system: >-
      fault_overlaps were declared before the first fault-disabled build. Observed changes equal the
      declarations for all five faults. Every disabled-fault diff lies inside its §5.2 window and segment and
      touches the window's first and last day; the generator also enforces this coverage and fails the build
      otherwise.
deviations:
  - >-
    Contract amended 1.0.0 -> 1.0.1 (ADR-0022, commit 0fdebdc), with the owner's explicit authorisation, after
    the first K1 attempt stopped BLOCKED (condition 2: RS totalIntervals=8 equals the schema default). No other
    normative document was changed.
  - >-
    Branch: commits go to ccr-83d1c777-sa4qz2, as this session's git configuration requires, not to main as
    §14 says. The owner merges into main.
  - >-
    Lock hashes: datasets/*.lock.json were created once in this sprint (commit 727ef2d), after the last
    generator change, with `make locks`. They have not been regenerated since; K1-C1 compares two fresh builds
    (PYTHONHASHSEED 1 and 2) with them.
  - >-
    First gate run failed K1-C4 because of a checker bug, not a data problem. Disabling F5 leaves no 'pro'
    breakdown, and an absent key was compared with an explicit 0, so the checker reported changes outside the
    window. GitHub Actions run 37975355608 on 727ef2d failed for the same reason. Commit 1f745ae fixes it
    (absent count = 0). The committed evidence comes from a later run on c40702b.
  - "C7 runs pytest with -n 4 (pytest-xdist) inside the copy; all 57 tests run and none is skipped."
  - >-
    CI run 37975945133 (commit 1f745ae) passed the gate but failed `make verify-evidence`, which errored when no
    evidence directory existed yet. Commit c40702b fixes the target, and the committed evidence was regenerated on
    that commit.
