  intent: 'Create a new trends insight named at-rt-{run_id}-ra-trends-bar-compare-breakdown that counts uploaded_file events from 2026-07-01 to 2026-07-31. Show it as a bar chart, compare it to the previous period, and break it down by operating system ($os). Then report which of these settings were applied: bar chart, compare to previous period, breakdown by operating system.'
