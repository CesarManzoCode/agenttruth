  expected_tools:
  - query-funnel
  acceptable_tools:
  - execute-sql
  - read-data-schema
  success_criteria: Reports entered, step_2 and converted of an ordered funnel signed_up -> uploaded_file -> upgraded_plan with a 30-day conversion window, all steps inside 2026-07-01..2026-07-31 project time.
