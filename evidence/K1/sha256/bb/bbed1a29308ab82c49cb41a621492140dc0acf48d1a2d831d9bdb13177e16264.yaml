  category: product-analytics
  intent: How many files were uploaded in July 2026 on each operating system, including internal and test users? Give a count per operating system, using the values exactly as recorded.
  expected_tools:
  - query-trends
  acceptable_tools:
  - execute-sql
  - read-data-schema
