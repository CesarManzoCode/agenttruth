- id: ea-funnel-signup-upload-june
  category: product-analytics
  intent: 'Looking only at activity from June 1 to June 30, 2026: how many people signed up, and how many of them uploaded a file within 14 days after signing up? Report the number who signed up as entered and the number who then uploaded as converted.'
  expected_tools:
  - query-funnel
  acceptable_tools:
  - execute-sql
  - read-data-schema
  success_criteria: Reports entered and converted of an ordered funnel signed_up -> uploaded_file with a 14-day conversion window, both steps inside 2026-06-01..2026-06-30 project time.
- id: ea-funnel-signup-upload-1d
  category: product-analytics
  intent: 'Looking only at activity from June 1 to June 30, 2026: how many people signed up, and how many of them uploaded a file within 1 day after signing up? Report the number who signed up as entered and the number who then uploaded as converted.'
  expected_tools:
  - query-funnel
  acceptable_tools:
  - execute-sql
  - read-data-schema
  success_criteria: Reports entered and converted of an ordered funnel signed_up -> uploaded_file with a 1-day conversion window, both steps inside 2026-06-01..2026-06-30 project time.
