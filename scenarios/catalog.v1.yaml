# AgentTruth scenario catalog v1 (contract §7). A superset of PostHog's tasks.yaml v2 task
# (id, category, intent, expected_tools, acceptable_tools, success_criteria keep PostHog's meaning);
# AgentTruth fields live under `agenttruth:`. Exact-answer and planted-cause prompts are final text,
# frozen by this file's hash. Round-trip-agent prompts are drafts until K4.
schema: agenttruth.catalog/v1
version: 1
dataset: ds1
scenarios:

