  - id: ea-sql-power-uploaders
    category: sql
    intent: "How many people signed up in June 2026 and uploaded at least 3 files within 7 days after signing up?"
    expected_tools: [execute-sql]
    acceptable_tools: [read-data-schema]
    success_criteria: "Counts persons whose first signed_up event between 2026-06-01 and 2026-06-30 project time is followed by at least 3 uploaded_file events no later than 7 days after it."
    agenttruth:
      kind: exact_answer
      answer_kind: count
      metric: {type: custom, function: power_uploaders, event: uploaded_file, anchor_event: signed_up, min_count: 3, within_days: 7, date_from: 2026-06-01, date_to: 2026-06-30, filter_test_accounts: false}
      signatures: [SIG_PERIOD_PREV, SIG_PERIOD_EXCL_END, SIG_TZ_UTC, SIG_EVENT_downloaded_file]
      semantics: [SEM-01, SEM-04, SEM-13]
      fault_overlaps: [F3]
      posthog_query: >-
        SELECT count() FROM (
        SELECT s.person_id AS person_id FROM (
        SELECT person_id, min(timestamp) AS signup_ts FROM events
        WHERE event = 'signed_up' AND toDate(timestamp) >= toDate('2026-06-01') AND toDate(timestamp) <= toDate('2026-06-30')
        GROUP BY person_id) AS s
        INNER JOIN (SELECT person_id, timestamp FROM events WHERE event = 'uploaded_file') AS u ON u.person_id = s.person_id
        WHERE u.timestamp >= s.signup_ts AND u.timestamp <= s.signup_ts + INTERVAL 7 DAY
        GROUP BY s.person_id HAVING count() >= 3)

  - id: ea-sql-top-filetypes-aug
    category: sql
    intent: "What were the top 3 file types by number of uploads in August 2026, excluding internal and test users? List them from most to fewest uploads, using the values exactly as recorded."
    expected_tools: [execute-sql]
    acceptable_tools: [query-trends, read-data-schema]
    success_criteria: "Lists the three file_type values with the most uploaded_file events from 2026-08-01 to 2026-08-31 project time, test accounts filtered, in descending order."
    agenttruth:
      kind: exact_answer
      answer_kind: ranking
      metric: {type: custom, function: top_values, event: uploaded_file, property: file_type, top_n: 3, date_from: 2026-08-01, date_to: 2026-08-31, filter_test_accounts: true}
      signatures: [SIG_PERIOD_PREV, SIG_EVENT_downloaded_file, SIG_TEST_ACCOUNTS]
      semantics: [SEM-01, SEM-05, SEM-12, SEM-13]
      fault_overlaps: []
      posthog_query: >-
        SELECT properties.file_type AS file_type, count() AS uploads FROM events
        WHERE event = 'uploaded_file' AND toDate(timestamp) >= toDate('2026-08-01') AND toDate(timestamp) <= toDate('2026-08-31')
        AND coalesce(person.properties.email, '') NOT ILIKE '%@hedgebox-internal.example%'
        GROUP BY file_type ORDER BY uploads DESC LIMIT 3

