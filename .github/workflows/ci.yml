name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.24"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
      - name: uv sync --frozen
        run: uv sync --frozen
      - name: make check
        run: make check
      - name: make gate-K1
        run: make gate-K1
      - name: verify committed evidence
        run: make verify-evidence
      - name: upload gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: build/gates/
          if-no-files-found: ignore
