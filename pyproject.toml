[project]
name = "agenttruth"
version = "0.1.0"
description = "Exact-answer and round-trip evals for agents driving PostHog's MCP, with truth known by construction."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "César Manzo" }]
requires-python = "==3.14.6"
dependencies = [
    "pydantic==2.14.0",
    "pyyaml==6.0.3",
    "jsonschema==4.26.0",
]

[project.scripts]
agenttruth = "agenttruth.cli:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-xdist==3.8.0",
    "hypothesis==6.168.5",
    "ruff==0.16.10",
    "mypy==2.4.0",
]

[build-system]
requires = ["uv_build==0.12.24"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.24"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["third_party", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PIE", "PT", "RET", "TID"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "yaml.*", "jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "live: test that touches a live external service (never run offline)",
]
