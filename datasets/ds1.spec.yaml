# Dataset ds1 (contract §5.2). Every value here is part of the construction: changing it changes the
# dataset and its lock hashes. Planted journeys put the §5.2 edge cases at exact local times
# (America/Mexico_City, UTC-06:00); random journeys come from the seeded generator.
schema: agenttruth.dataset-spec/v1
dataset_id: ds1
seed: agenttruth-ds1-v1
timezone: America/Mexico_City
week_start_day: 1
test_account_filters:
  - {key: email, type: person, value: "@hedgebox-internal.example", operator: not_icontains}
window: {date_from: 2026-06-01, date_to: 2026-08-31}
warmup: {date_from: 2026-05-18, date_to: 2026-05-31}
population:
  users: 2400
  warmup_users: 220
  internal_users: 40
  visitors: 3000
catalog: scenarios/catalog.v1.yaml

faults:
  - {id: F1, cause_type: tracking_outage, event: uploaded_file, date_from: 2026-07-15, date_to: 2026-07-17,
     property: $os, property_type: event, operator: exact, value: Android}
  - {id: F2, cause_type: duplicate_events, event: shared_file_link, date_from: 2026-08-03, date_to: 2026-08-09,
     property: $browser, property_type: event, operator: exact, value: Firefox, duplicate_delay_ms: [50, 400]}
  - {id: F3, cause_type: identity_break, event: $identify, date_from: 2026-06-22, date_to: 2026-06-28,
     property: $current_url, property_type: event, operator: icontains, value: /signup/mobile}
  - {id: F4, cause_type: internal_traffic, event: $pageview, date_from: 2026-07-27, date_to: 2026-07-29,
     property: email, property_type: person, operator: icontains, value: hedgebox-internal.example, multiplier: 30}
  - {id: F5, cause_type: property_value_change, event: upgraded_plan, date_from: 2026-08-17, date_to: 2026-08-31,
     property: new_plan, property_type: event, operator: exact, value: pro, replaces: personal/pro}

